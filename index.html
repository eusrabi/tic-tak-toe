<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tic Tac Toe</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e0e7ef 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }
        h1 {
            margin-top: 40px;
            color: #2d3748;
            letter-spacing: 2px;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 10px;
            margin: 30px auto 20px auto;
            background: #cbd5e1;
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        .cell {
            width: 100px;
            height: 100px;
            font-size: 2.5em;
            font-weight: bold;
            color: #2b6cb0;
            background: #fff;
            border: 2px solid #94a3b8;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .cell:hover {
            background: #e0e7ef;
        }
        .cell.winner {
            background: #38b2ac;
            color: #fff;
            box-shadow: 0 0 12px #38b2ac88;
        }
        #status {
            font-size: 1.2em;
            margin-bottom: 16px;
            color: #2d3748;
        }
        button {
            padding: 10px 28px;
            font-size: 1em;
            background: #2b6cb0;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: background 0.2s;
        }
        button:hover {
            background: #2c5282;
        }
    </style>
</head>
<body>
    <h1>Tic Tac Toe</h1>
    <div class="board" id="board"></div>
    <p id="status"></p>
    <button onclick="resetGame()">Restart</button>
    <script>
        const board = document.getElementById('board');
        const status = document.getElementById('status');
        let cells = Array(9).fill(null);
        let xTurn = true;
        let gameOver = false;
        let winLine = [];

        function render() {
            board.innerHTML = '';
            cells.forEach((cell, i) => {
                const div = document.createElement('div');
                div.className = 'cell';
                if (winLine.includes(i)) div.classList.add('winner');
                div.textContent = cell || '';
                div.onclick = () => handleClick(i);
                board.appendChild(div);
            });
            status.textContent = gameOver
                ? (getWinner() ? `🎉 Winner: ${getWinner()}` : "It's a draw!")
                : `Turn: ${xTurn ? '❌ X' : '⭕ O'}`;
        }

        function handleClick(i) {
            if (cells[i] || gameOver) return;
            cells[i] = xTurn ? 'X' : 'O';
            const winner = getWinner();
            if (winner || cells.every(cell => cell)) gameOver = true;
            xTurn = !xTurn;
            render();
        }

        function getWinner() {
            const wins = [
                [0,1,2],[3,4,5],[6,7,8],
                [0,3,6],[1,4,7],[2,5,8],
                [0,4,8],[2,4,6]
            ];
            for (const line of wins) {
                const [a, b, c] = line;
                if (cells[a] && cells[a] === cells[b] && cells[a] === cells[c]) {
                    winLine = line;
                    return cells[a];
                }
            }
            winLine = [];
            return null;
        }

        function resetGame() {
            cells = Array(9).fill(null);
            xTurn = true;
            gameOver = false;
            winLine = [];
            render();
        }

        render();
    </script>
</body>
</html>
